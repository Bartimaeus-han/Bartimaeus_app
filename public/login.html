<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>Login</title>
        <style>
            @media (prefers-color-scheme: dark) {
                body {
                    background-color: #121212 !important;
                    color: #ffffff !important;
                }
                input {
                    background-color: #2d2d2d !important;
                    color: #ffffff !important;
                    border: 1px solid #555555 !important;
                }
                button {
                    background-color: #333333 !important;
                    color: #ffffff !important;
                    border: 1px solid #555555 !important;
                }
                a {
                    color: #60a5fa !important;
                }
            }
        </style>
    </head>
    <body>
        <h2>Login</h2>

        <!-- Login form for send user's input-->
        <form id="loginForm">
            <!-- ID & Password input window -->
            ID: <input type="text" id="username" required /><br /><br />
            <!-- type="password" hide input value -->
            PW: <input type="password" id="password" required /><br /><br />
            <button type="submit">Log in</button>
        </form>

        <!-- error message display area -->
        <div id="errorMsg" style="color: red; margin-top: 10px"></div>
        <br />

        <!-- Link to sign up page -->
        <a href="/signup.html">Sign Up</a>

        <!-- The part inside the <script> tag is interpreted using JS syntax-->
        <script src="/js/login.js"></script>
    </body>
</html>
