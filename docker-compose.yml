services:
  mariadb:
    image: mariadb:11.4
    container_name: bartimaeus-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: bartimaeus_db
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - 3_internal_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: bartimaeus-app
    restart: unless-stopped
    depends_on:
      - mariadb
    environment:
      DB_HOST: mariadb
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: bartimaeus_db
      DB_PORT: "3306"
    networks:
      - 3_internal_net
    mem_limit: 2g

  screening-router:
    build:
      context: .
      dockerfile: Dockerfile
      target: screening-router
    container_name: bartimaeus-screening-router
    restart: unless-stopped
    ports:
      - "8080:8080" # Sole entry point for external traffic
    networks:
      - 1_external_net # External incoming interface (eth0)
      - 2_dmz_net # DMZ forwarding interface (eth1)
    cap_add:
      - NET_ADMIN # Network administration privilege
      - NET_RAW # Raw socket creation privilege
    depends_on:
      - reverse-proxy

  reverse-proxy:
    build:
      context: .
      dockerfile: Dockerfile
      target: reverse-proxy
    container_name: bartimaeus-reverse-proxy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      BACKEND_HOST: app
    networks:
      - 2_dmz_net # Receive filtered packets from screening router
      - 3_internal_net # Forward traffic to backend app

volumes:
  mariadb_data:

    # 망 분리를 위한 3대 독립 가상 네트워크 정의
networks:
  1_external_net:
    driver: bridge # Network for incoming external traffic
  2_dmz_net:
    driver: bridge # DMZ zone between screening router and reverse proxy
  3_internal_net:
    driver: bridge # Internal private network between backend app and DB
